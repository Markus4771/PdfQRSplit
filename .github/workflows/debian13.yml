name: Debian 13 checks
on:
  push:
  pull_request:
jobs:
  debian13:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          # Debian 13 names the zbar library libzbar0t64 and ships no pyzbar
          # module; pyzbar itself comes from pip below.
          apt-get install -y git ca-certificates python3 python3-pip python3-venv python3-pytest python3-pymupdf python3-pil libzbar0t64 bash
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --disable-pip-version-check \
            "scan-pdf-cleaner-cli==1.0.0" pypdf pypdf4 pypdfium2 opencv-python-headless pyzbar pymupdf pillow
      - name: Check shell and Python syntax
        run: |
          bash -n install.sh
          python3 -m compileall -q .
      - name: Execute regression suite
        run: /tmp/venv/bin/python -m unittest discover -v -s . -p 'test_*.py' 
